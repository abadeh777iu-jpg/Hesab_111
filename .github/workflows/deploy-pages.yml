name: Deploy Scalable to GitHub Pages

on:
  push:
    branches:
      - main
      - arena/01a0d7b6-hesab-111
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Try to download the original background video
        continue-on-error: true
        run: npm run assets:video
      - name: Build for the GitHub Pages project path
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Check TypeScript
        run: npm run typecheck
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish website
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
